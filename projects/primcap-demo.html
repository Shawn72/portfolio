<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primcap Staff Portal — Interactive Client Walkthrough</title>
<style>
:root{--navy:#0b1739;--blue:#2f6fed;--red:#ff3b30;--ink:#17213b;--muted:#68718a;--line:#dde3ef;--green:#1f9d69}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#eef2f8;color:var(--ink)}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#0b1739,#08122d);color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:22px;font-weight:850}.brand small{display:block;margin-top:4px;color:#9eb0db;font-size:10px;letter-spacing:.8px}.section-label{font-size:10px;text-transform:uppercase;color:#7586b4;letter-spacing:1px;margin:22px 10px 8px}.nav button{width:100%;border:0;background:transparent;color:#b8c3e0;text-align:left;padding:10px 11px;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer;margin:2px 0}.nav button.on{background:#ffffff14;color:#fff;box-shadow:inset 3px 0 #5e8df7}.nav .num{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;border-radius:50%;background:#ffffff10;font-size:10px}.back{display:block;color:#9eb0db;text-decoration:none;font-size:12px;font-weight:700;margin:18px 10px}.main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.top h1{font-size:19px;margin:0}.top p{font-size:11px;color:var(--muted);margin:3px 0 0}.progress{font-size:12px;font-weight:800;color:var(--muted)}.content{padding:24px;max-width:1500px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 8px 28px rgba(20,35,70,.06)}.head{padding:21px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:18px}.head h2{margin:4px 0 6px;font-size:24px}.head p{margin:0;color:var(--muted);font-size:13px;line-height:1.5;max-width:900px}.path{white-space:nowrap;background:#edf3ff;color:#234caa;padding:8px 11px;border-radius:999px;font-size:11px;font-weight:850;height:max-content}.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px}.visual{background:#101829;padding:20px;display:grid;place-items:center;min-height:570px}.shot{position:relative;width:100%;max-width:1080px;overflow:hidden;border-radius:12px;background:#fff;box-shadow:0 18px 55px rgba(0,0,0,.28)}.shot img{display:block;width:100%;height:auto}.marker{position:absolute;border:4px solid var(--red);border-radius:10px;box-shadow:0 0 0 5px rgba(255,59,48,.15);pointer-events:none;animation:pulse 1.6s infinite}.marker:after{content:"";position:absolute;right:-10px;top:50%;transform:translateY(-50%);width:13px;height:13px;border-radius:50%;background:var(--red);border:3px solid #fff}.label{position:absolute;background:var(--red);color:#fff;padding:7px 10px;border-radius:8px;font-size:11px;font-weight:850;max-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.22)}.label:before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:8px solid var(--red)}@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(255,59,48,.12)}50%{box-shadow:0 0 0 10px rgba(255,59,48,.025)}}
.notes{padding:23px;background:#fbfcff;border-left:1px solid var(--line)}.notes h3{font-size:14px;margin:0 0 11px}.notes ol{margin:0;padding-left:20px}.notes li{font-size:12px;line-height:1.55;margin-bottom:10px}.tip,.outcome{margin-top:14px;padding:12px;border-radius:10px;font-size:12px;line-height:1.5}.tip{background:#f2f7ff;border:1px solid #dce8ff;color:#365079}.outcome{background:#f2fbf7;border:1px solid #d7f1e5;color:#27694e}.legend{padding:10px 22px;background:#fff8f7;color:#8e2a23;font-size:11px;border-top:1px solid #ffe1de}.controls{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 20px;border-top:1px solid var(--line)}.btn{border:1px solid var(--line);background:#fff;padding:10px 15px;border-radius:9px;font-weight:850;cursor:pointer}.btn.next{background:var(--blue);color:#fff;border-color:var(--blue)}.btn:disabled{opacity:.35;cursor:not-allowed}.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.dot{width:8px;height:8px;border-radius:50%;background:#d5dbea}.dot.on{background:var(--blue);transform:scale(1.25)}.cover{padding:44px;background:linear-gradient(135deg,#0b1739,#17336f 60%,#2f6fed);color:#fff;min-height:600px;display:grid;grid-template-columns:1.25fr .75fr;gap:34px;align-items:center}.cover .badge{display:inline-block;padding:8px 11px;border-radius:999px;background:#ffffff15;border:1px solid #ffffff20;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.8px}.cover h2{font-size:44px;line-height:1.05;max-width:760px;margin:12px 0 16px}.cover p{max-width:820px;color:#dbe5ff;line-height:1.6}.flow{background:#ffffff0e;border:1px solid #ffffff1e;border-radius:16px;padding:20px}.flow div{padding:11px 0;border-bottom:1px solid #ffffff16;font-size:12px}.flow div:last-child{border:0}.detect-note{font-size:10px;color:#8e2a23;margin-top:8px}@media(max-width:1050px){.app{grid-template-columns:1fr}.side{display:none}.stage{grid-template-columns:1fr}.notes{border-left:0;border-top:1px solid var(--line)}.cover{grid-template-columns:1fr}}@media print{.side,.top,.controls{display:none}.app{display:block}.content{padding:0}.card{box-shadow:none;border:0}.stage{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">PRIMCAP<small>INTERACTIVE STAFF PORTAL WALKTHROUGH</small></div><div class="section-label">Guided journey</div><div class="nav" id="nav"></div><a class="back" href="primcap.html">← Back to Primcap project</a></aside>
<main class="main"><div class="top"><div><h1>Primcap Staff Portal</h1><p>Interactive client presentation prototype</p></div><div class="progress" id="progress"></div></div><div class="content"><div class="card" id="card"></div></div></main>
</div>
<script>
const BASE='../assets/primcap/';
const steps=[
{title:'Welcome: how Primcap works',menu:'Overview',image:null,intro:'A guided tour of Primcap’s multi-branch microfinance staff portal — daily performance, customer search, internal support, fine-grained access control, branch overrides, portal visibility, logs, and recovery tooling.',notes:['Primcap brings branch operations and administration into one staff portal.','The walkthrough uses the real portfolio screenshots and the current portal navigation structure.','Use the left journey menu, Previous/Next buttons, or keyboard arrow keys to present it step by step.'],outcome:'The client sees both the operational value and the controls that keep the portal manageable across branches.'},
{title:'1. Start with branch performance',menu:'Dashboard → Home',image:'dashboard.png',intro:'The Home dashboard gives staff and management a same-day view of the business across branches.',notes:["Open Dashboard, then Home.","Review today’s leads, loans disbursed, current customers, and today’s collection.","Use the branch charts to compare collection rate and active-customer performance across Kilifi, Kitengela, Mtwapa, Nyali, and Ukunda."],outcome:'Management can identify branch performance and exceptions immediately instead of assembling figures manually.',label:'Dashboard / Home',fallback:{x:2,y:17,w:18,h:7}},
{title:'2. Find a customer across branches',menu:'Search → Customer Search',image:'customer-search.png',intro:'Customer Search provides a cross-branch operational lookup with staff and business context.',notes:['Expand Search & Filters.','Open Customer Search.','Search the customer and review the related branch, loan officer, collection officer, and business information.','Export the results when the data needs to be shared or reconciled.'],outcome:'Staff can find the right customer record quickly without navigating branch-by-branch.',label:'Customer Search',fallback:{x:2,y:29,w:19,h:7}},
{title:'3. Handle internal support',menu:'Support Tickets → All Tickets',image:'support-tickets.png',intro:'Support Tickets keeps operational issues visible, assigned, prioritized, and traceable inside the portal.',notes:['Open Support Tickets, then All Tickets.','Review priority, status, assignment, and recent activity.','Open the relevant ticket and continue the conversation or update ownership/status.','Closed-ticket attachments can be cleaned up by scheduled maintenance.'],outcome:'Operational support stays tied to the business context and has a clear history.',label:'Support Tickets',fallback:{x:2,y:23,w:19,h:7}},
{title:'4. Control roles and rights',menu:'Administration → Roles & Rights',image:'roles-rights.png',intro:'Primcap uses a catalog of individually assignable rights instead of relying on role names alone.',notes:['Open Administration → Roles & Rights.','Select a role such as Team Lead, Loan Officer, Branch Manager, or Super Admin.','Review the exact rights attached to the role — for example collection, customer, loan, or administration capabilities.','Save only the permissions required for that responsibility.'],outcome:'Access is explainable and auditable: the role’s real capabilities are explicitly defined.',label:'Roles & Rights',fallback:{x:2,y:78,w:20,h:7}},
{title:'5. Override access by branch',menu:'Roles & Rights → Users → Branch access',image:'branch-access.png',intro:'A user can have access to additional branches and, where necessary, a different role at a specific branch.',notes:['From Roles & Rights, open the Users/branch-access workflow.','Choose the staff member.','Grant access to the additional branch.','Optionally assign a branch-specific role override when the person has different responsibilities at that location.'],outcome:'One person can operate with the right level of authority at each branch without creating duplicate accounts.',label:'Branch access',fallback:{x:2,y:78,w:20,h:7}},
{title:'6. Decide exactly what each user sees',menu:'Administration → Portal Menu Management',image:'portal-menu-management.png',intro:'Portal Menu Management controls visibility beyond whole pages — down to specific dashboard cards and charts.',notes:['Open Portal Menu Management.','Choose the sidebar section, page, dashboard stat card, or chart to configure.','Enable or disable visibility and review the explicit active-user list.','Use this for exceptions where user-level visibility should differ from the general role.'],outcome:'The portal can be tailored precisely without hard-coding one UI for every role.',label:'Portal Menu Management',fallback:{x:2,y:84,w:22,h:7}},
{title:'7. Maintain system logs safely',menu:'System Administration → Logs',image:'system-logs.png',intro:'Superadmin tooling exposes log maintenance without requiring direct access to the server.',notes:['Open the System administration area and select Logs.','Review the last cleanup status and available log files.','Preview or download a file before deleting it when investigation is required.','Run age-based cleanup carefully because log deletion is destructive.'],outcome:'Support and maintenance can be performed from the portal while keeping destructive actions restricted.',label:'System / Logs',fallback:{x:2,y:78,w:20,h:7}},
{title:'8. Create and use recovery backups',menu:'System Administration → Backups',image:'backups.png',intro:'Primcap provides stored-procedure snapshots and deployment backups as part of operational recovery.',notes:['Open Backups from the protected system administration area.','Create an on-demand stored-procedure snapshot when needed.','Review deployment ZIP backups captured for UAT and Production releases.','Download the relevant backup before a rollback or recovery procedure.'],outcome:'Recovery assets are available through controlled tooling rather than depending on ad-hoc server access.',label:'Backups',fallback:{x:2,y:78,w:20,h:7}}
];
let idx=0;
const nav=document.getElementById('nav'),card=document.getElementById('card'),progress=document.getElementById('progress');
function e(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function renderNav(){nav.innerHTML=steps.map((s,i)=>`<button type="button" class="${i===idx?'on':''}" data-step="${i}"><span class="num">${i}</span>${e(s.menu)}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.step)))}
function cover(s){return `<div class="cover"><div><span class="badge">Interactive Client Prototype</span><h2>Primcap — Multi-Branch Microfinance Staff Portal</h2><p>${e(s.intro)}</p><p style="font-size:12px;color:#b9c9ef">The red highlight on each screen is aligned to the actual active Primcap navigation row when the screenshot exposes one.</p></div><div class="flow"><div>01 — Dashboard & branch performance</div><div>02 — Customer search</div><div>03 — Support tickets</div><div>04 — Roles & rights</div><div>05 — Branch access overrides</div><div>06 — Portal menu visibility</div><div>07 — Logs</div><div>08 — Backups & recovery</div></div></div>`}
function regular(s){return `<div class="head"><div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--blue);font-weight:850">Primcap walkthrough</div><h2>${e(s.title)}</h2><p>${e(s.intro)}</p></div><div class="path">Menu: ${e(s.menu)}</div></div><div class="stage"><div class="visual"><div class="shot"><img id="screen" src="${BASE+s.image}" alt="${e(s.title)}"><div id="marker" class="marker" hidden></div><div id="markerLabel" class="label" hidden>${e(s.label)}</div></div></div><aside class="notes"><h3>What to explain</h3><ol>${s.notes.map(n=>`<li>${e(n)}</li>`).join('')}</ol><div class="tip"><strong>Presenter tip:</strong> Point to the red-highlighted navigation/action first, then explain what the staff member does and why it matters.</div><div class="outcome"><strong>Outcome:</strong> ${e(s.outcome)}</div><div class="detect-note" id="detectNote"></div></aside></div><div class="legend">Red highlight = the real active navigation/action area detected from this screenshot. A fallback is used only when the screenshot does not expose a clear active row.</div>`}
function controls(){return `<div class="controls"><button type="button" id="prev" class="btn" ${idx===0?'disabled':''}>← Previous</button><div class="dots">${steps.map((_,i)=>`<span class="dot ${i===idx?'on':''}"></span>`).join('')}</div><button type="button" id="next" class="btn next" ${idx===steps.length-1?'disabled':''}>Next →</button></div>`}
function render(){const s=steps[idx];card.innerHTML=(idx===0?cover(s):regular(s))+controls();progress.textContent=`Step ${idx+1} of ${steps.length}`;renderNav();document.getElementById('prev')?.addEventListener('click',()=>go(idx-1));document.getElementById('next')?.addEventListener('click',()=>go(idx+1));if(idx>0){const img=document.getElementById('screen');img.addEventListener('load',()=>alignMarker(img,s),{once:true});if(img.complete)alignMarker(img,s)}window.scrollTo({top:0,behavior:'smooth'})}
function accent(r,g,b){const max=Math.max(r,g,b),min=Math.min(r,g,b);if(max<80||max-min<38)return false;const blueish=b>r*1.12&&b>g*.86;const cyanish=g>r*1.12&&b>r*1.12;return blueish||cyanish}
function alignMarker(img,s){const marker=document.getElementById('marker'),label=document.getElementById('markerLabel'),note=document.getElementById('detectNote');if(!marker||!label)return;try{const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});const nw=img.naturalWidth,nh=img.naturalHeight;c.width=nw;c.height=nh;ctx.drawImage(img,0,0);const x0=Math.floor(nw*.01),x1=Math.floor(nw*.31),y0=Math.floor(nh*.12),y1=Math.floor(nh*.94),stepX=Math.max(1,Math.floor(nw/900)),stepY=Math.max(1,Math.floor(nh/700));const data=ctx.getImageData(0,0,nw,nh).data;let rows=[];for(let y=y0;y<y1;y+=stepY){let cnt=0;for(let x=x0;x<x1;x+=stepX){const k=(y*nw+x)*4;if(accent(data[k],data[k+1],data[k+2]))cnt++}rows.push({y,cnt})}const smooth=[];const radius=Math.max(2,Math.floor(12/stepY));for(let i=0;i<rows.length;i++){let total=0;for(let j=Math.max(0,i-radius);j<=Math.min(rows.length-1,i+radius);j++)total+=rows[j].cnt;smooth.push({y:rows[i].y,score:total})}smooth.sort((a,b)=>b.score-a.score);const best=smooth[0];const minScore=((x1-x0)/stepX)*radius*.18;if(!best||best.score<minScore)throw new Error('No clear active row');const bandH=Math.max(24,Math.floor(nh*.045)),top=Math.max(y0,best.y-bandH/2),bottom=Math.min(y1,best.y+bandH/2);let minX=x1,maxX=x0,found=0;for(let y=Math.floor(top);y<bottom;y+=stepY){for(let x=x0;x<x1;x+=stepX){const k=(y*nw+x)*4;if(accent(data[k],data[k+1],data[k+2])){minX=Math.min(minX,x);maxX=Math.max(maxX,x);found++}}}if(found<20||maxX-minX<nw*.05){minX=nw*.015;maxX=nw*.20}const padX=nw*.008,padY=nh*.007;place(marker,label,{x:(minX-padX)/nw*100,y:(top-padY)/nh*100,w:(maxX-minX+padX*2)/nw*100,h:(bottom-top+padY*2)/nh*100},s.label);note.textContent='Marker aligned automatically from the active row in the screenshot.'}catch(err){place(marker,label,s.fallback,s.label);note.textContent='This screenshot did not expose a clear active-row color, so the stored screen-specific fallback is being used.'}}
function place(marker,label,b,labelText){const x=Math.max(.5,b.x),y=Math.max(.5,b.y),w=Math.min(29,b.w),h=Math.min(12,b.h);marker.style.left=x+'%';marker.style.top=y+'%';marker.style.width=w+'%';marker.style.height=h+'%';marker.hidden=false;let lx=x+w+2;if(lx>77)lx=Math.max(1,x-22);label.style.left=lx+'%';label.style.top=(y+Math.max(0,h/2-2.5))+'%';label.textContent=labelText;label.hidden=false}
function go(i){if(i<0||i>=steps.length)return;idx=i;render()}
document.addEventListener('keydown',ev=>{if(ev.target&&/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName))return;if(ev.key==='ArrowRight')go(idx+1);if(ev.key==='ArrowLeft')go(idx-1)});render();
</script>
</body></html>
