<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primcap Staff Portal — Interactive Client Walkthrough</title>
<style>
:root{--navy:#0b1739;--blue:#2f6fed;--red:#ff3b30;--ink:#17213b;--muted:#68718a;--line:#dde3ef}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#eef2f8;color:var(--ink)}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#0b1739,#08122d);color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:22px;font-weight:850}.brand small{display:block;margin-top:4px;color:#9eb0db;font-size:10px;letter-spacing:.8px}.section-label{font-size:10px;text-transform:uppercase;color:#7586b4;letter-spacing:1px;margin:22px 10px 8px}
.nav button{width:100%;border:0;background:transparent;color:#b8c3e0;text-align:left;padding:10px 11px;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer;margin:2px 0}.nav button.on{background:#ffffff14;color:#fff;box-shadow:inset 3px 0 #5e8df7}.nav .num{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;border-radius:50%;background:#ffffff10;font-size:10px}.back{display:block;color:#9eb0db;text-decoration:none;font-size:12px;font-weight:700;margin:18px 10px}
.main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.top h1{font-size:19px;margin:0}.top p{font-size:11px;color:var(--muted);margin:3px 0 0}.progress{font-size:12px;font-weight:800;color:var(--muted)}
.content{padding:24px;max-width:1500px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 8px 28px rgba(20,35,70,.06)}.head{padding:21px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:18px}.head h2{margin:4px 0 6px;font-size:24px}.head p{margin:0;color:var(--muted);font-size:13px;line-height:1.5;max-width:900px}.path{white-space:nowrap;background:#edf3ff;color:#234caa;padding:8px 11px;border-radius:999px;font-size:11px;font-weight:850;height:max-content}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px}.visual{background:#101829;padding:20px;display:grid;place-items:center;min-height:570px}.shot{position:relative;width:100%;max-width:1080px;overflow:hidden;border-radius:12px;background:#fff;box-shadow:0 18px 55px rgba(0,0,0,.28)}.shot img{display:block;width:100%;height:auto}
.marker{position:absolute;border:4px solid var(--red);border-radius:9px;box-shadow:0 0 0 5px rgba(255,59,48,.15);pointer-events:none;animation:pulse 1.6s infinite}.marker:after{content:"";position:absolute;right:-10px;top:50%;transform:translateY(-50%);width:13px;height:13px;border-radius:50%;background:var(--red);border:3px solid #fff}
.label{position:absolute;background:var(--red);color:#fff;padding:7px 10px;border-radius:8px;font-size:11px;font-weight:850;max-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.22)}.label:before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:8px solid var(--red)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(255,59,48,.12)}50%{box-shadow:0 0 0 10px rgba(255,59,48,.025)}}
.notes{padding:23px;background:#fbfcff;border-left:1px solid var(--line)}.notes h3{font-size:14px;margin:0 0 11px}.notes ol{margin:0;padding-left:20px}.notes li{font-size:12px;line-height:1.55;margin-bottom:10px}.tip,.outcome{margin-top:14px;padding:12px;border-radius:10px;font-size:12px;line-height:1.5}.tip{background:#f2f7ff;border:1px solid #dce8ff;color:#365079}.outcome{background:#f2fbf7;border:1px solid #d7f1e5;color:#27694e}.detect-note{font-size:10px;color:#8e2a23;margin-top:8px}
.legend{padding:10px 22px;background:#fff8f7;color:#8e2a23;font-size:11px;border-top:1px solid #ffe1de}.controls{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 20px;border-top:1px solid var(--line)}.btn{border:1px solid var(--line);background:#fff;padding:10px 15px;border-radius:9px;font-weight:850;cursor:pointer}.btn.next{background:var(--blue);color:#fff;border-color:var(--blue)}.btn:disabled{opacity:.35}.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.dot{width:8px;height:8px;border-radius:50%;background:#d5dbea}.dot.on{background:var(--blue);transform:scale(1.25)}
.cover{padding:44px;background:linear-gradient(135deg,#0b1739,#17336f 60%,#2f6fed);color:#fff;min-height:600px;display:grid;grid-template-columns:1.25fr .75fr;gap:34px;align-items:center}.cover .badge{display:inline-block;padding:8px 11px;border-radius:999px;background:#ffffff15;border:1px solid #ffffff20;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.8px}.cover h2{font-size:44px;line-height:1.05;max-width:760px;margin:12px 0 16px}.cover p{max-width:820px;color:#dbe5ff;line-height:1.6}.flow{background:#ffffff0e;border:1px solid #ffffff1e;border-radius:16px;padding:20px}.flow div{padding:11px 0;border-bottom:1px solid #ffffff16;font-size:12px}.flow div:last-child{border:0}
@media(max-width:1050px){.app{grid-template-columns:1fr}.side{display:none}.stage{grid-template-columns:1fr}.notes{border-left:0;border-top:1px solid var(--line)}.cover{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">PRIMCAP<small>INTERACTIVE STAFF PORTAL WALKTHROUGH</small></div><div class="section-label">Guided journey</div><div class="nav" id="nav"></div><a class="back" href="primcap.html">← Back to Primcap project</a></aside>
<main class="main"><div class="top"><div><h1>Primcap Staff Portal</h1><p>Interactive client presentation prototype</p></div><div class="progress" id="progress"></div></div><div class="content"><div class="card" id="card"></div></div></main>
</div>
<script>
const BASE='../assets/primcap/';
const steps=[
{title:'Welcome: how Primcap works',menu:'Overview',image:null,intro:'A guided tour of Primcap’s multi-branch microfinance staff portal — daily performance, customer search, internal support, fine-grained access control, branch overrides, portal visibility, logs, and recovery tooling.',notes:['Primcap brings branch operations and administration into one staff portal.','The walkthrough uses the real portfolio screenshots and current portal navigation.','Use the left journey menu, Previous/Next buttons, or keyboard arrow keys to present it step by step.'],outcome:'The client sees both the operational value and the controls that keep the portal manageable across branches.'},
{title:'1. Start with branch performance',menu:'Dashboard → Home',image:'dashboard.png',intro:'The Home dashboard gives staff and management a same-day view of the business across branches.',notes:["Open Dashboard, then Home.","Review today’s leads, loans disbursed, current customers, and today’s collection.","Use the branch charts to compare performance across Kilifi, Kitengela, Mtwapa, Nyali, and Ukunda."],outcome:'Management can identify branch performance and exceptions immediately.',label:'Dashboard / Home',marker:{x:.6,y:17.0,w:15.0,h:4.8}},
{title:'2. Find a customer across branches',menu:'Search → Customer Search',image:'customer-search.png',intro:'Customer Search provides a cross-branch operational lookup with staff and business context.',notes:['Expand Search & Filters.','Open Customer Search.','Search the customer and review branch, loan officer, collection officer, and business information.','Export results when needed.'],outcome:'Staff can find the right customer record quickly without navigating branch-by-branch.',label:'Search → Customer Search',marker:{x:.6,y:42.2,w:15.0,h:4.8}},
{title:'3. Handle internal support',menu:'Support Tickets → All Tickets',image:'support-tickets.png',intro:'Support Tickets keeps operational issues visible, assigned, prioritized, and traceable inside the portal.',notes:['Open Support Tickets, then All Tickets.','Review priority, status, assignment, and activity.','Open the relevant ticket and update ownership/status as needed.'],outcome:'Operational support stays tied to business context with a clear history.',label:'Support Tickets → All Tickets',marker:{x:.6,y:30.0,w:15.0,h:4.8}},
{title:'4. Control roles and rights',menu:'Administration → Roles & Rights',image:'roles-rights.png',intro:'Primcap uses a catalog of individually assignable rights instead of relying on role names alone.',notes:['Open Administration → Roles & Rights.','Select the role.','Review the exact rights attached to it.','Save only the permissions required.'],outcome:'Access is explainable and auditable.',label:'Roles & Rights',marker:{x:.6,y:89.2,w:15.0,h:4.8}},
{title:'5. Override access by branch',menu:'Roles & Rights → Users → Branch access',image:'branch-access.png',intro:'A user can have access to additional branches and, where necessary, a different role at a specific branch.',notes:['Open the user/branch-access workflow from Roles & Rights.','Choose the staff member.','Grant the additional branch.','Optionally assign a branch-specific role override.'],outcome:'One user can carry the right authority at each branch without duplicate accounts.',label:'Roles & Rights → Branch access',marker:{x:.6,y:89.2,w:15.0,h:4.8}},
{title:'6. Decide exactly what each user sees',menu:'Administration → Portal Menu Management',image:'portal-menu-management.png',intro:'Portal Menu Management controls visibility beyond whole pages — down to dashboard cards and charts.',notes:['Open Portal Menu Management.','Choose the page, menu, stat card, or chart.','Enable or disable visibility and review the explicit user list.'],outcome:'The portal can be tailored precisely without hard-coding one UI for every role.',label:'Portal Menu Management',marker:{x:.5,y:78.3,w:13.2,h:4.1}},
{title:'7. Maintain system logs safely',menu:'System Administration → Logs',image:'system-logs.png',intro:'Superadmin tooling exposes log maintenance without requiring direct server access.',notes:['Open the protected system administration area and select Logs.','Review cleanup status and available log files.','Preview/download before deleting when investigation is required.'],outcome:'Maintenance can be performed from the portal while destructive actions remain restricted.',label:'Roles & Rights → System',marker:{x:.6,y:89.2,w:15.0,h:4.8}},
{title:'8. Create and use recovery backups',menu:'System Administration → Backups',image:'backups.png',intro:'Primcap provides stored-procedure snapshots and deployment backups for operational recovery.',notes:['Open Backups.','Create an on-demand stored-procedure snapshot when needed.','Review deployment ZIP backups for UAT and Production.','Download the relevant backup before rollback/recovery.'],outcome:'Recovery assets are available through controlled tooling instead of ad-hoc server access.',label:'Backups tab',marker:{x:27.2,y:15.6,w:6.4,h:4.6}}
];
let idx=0;
const nav=document.getElementById('nav'),card=document.getElementById('card'),progress=document.getElementById('progress');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function renderNav(){nav.innerHTML=steps.map((s,i)=>`<button type="button" class="${i===idx?'on':''}" data-i="${i}"><span class="num">${i}</span>${esc(s.menu)}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i))}
function cover(s){return `<div class="cover"><div><span class="badge">Interactive Client Prototype</span><h2>Primcap — Multi-Branch Microfinance Staff Portal</h2><p>${esc(s.intro)}</p><p style="font-size:12px;color:#b9c9ef">Every marker is mapped separately to the visible navigation row in that exact screenshot; there is no automatic guessing.</p></div><div class="flow"><div>01 — Dashboard & branch performance</div><div>02 — Customer search</div><div>03 — Support tickets</div><div>04 — Roles & rights</div><div>05 — Branch access overrides</div><div>06 — Portal visibility</div><div>07 — Logs</div><div>08 — Backups & recovery</div></div></div>`}
function regular(s){return `<div class="head"><div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--blue);font-weight:850">Primcap walkthrough</div><h2>${esc(s.title)}</h2><p>${esc(s.intro)}</p></div><div class="path">Menu: ${esc(s.menu)}</div></div><div class="stage"><div class="visual"><div class="shot"><img id="screen" src="${BASE+s.image}" alt="${esc(s.title)}"><div id="marker" class="marker" hidden></div><div id="markerLabel" class="label" hidden>${esc(s.label)}</div></div></div><aside class="notes"><h3>What to explain</h3><ol>${s.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ol><div class="tip"><strong>Presenter tip:</strong> Point to the red-highlighted navigation row first, then explain the page.</div><div class="outcome"><strong>Outcome:</strong> ${esc(s.outcome)}</div><div class="detect-note" id="detectNote"></div></aside></div><div class="legend">Red highlight = the visible Primcap menu/action used for this step. Each screen has its own verified marker position.</div>`}
function controls(){return `<div class="controls"><button class="btn" id="prev" ${idx===0?'disabled':''}>← Previous</button><div class="dots">${steps.map((_,i)=>`<span class="dot ${i===idx?'on':''}"></span>`).join('')}</div><button class="btn next" id="next" ${idx===steps.length-1?'disabled':''}>Next →</button></div>`}
function render(){const s=steps[idx];card.innerHTML=(idx===0?cover(s):regular(s))+controls();progress.textContent=`Step ${idx+1} of ${steps.length}`;renderNav();document.getElementById('prev')?.addEventListener('click',()=>go(idx-1));document.getElementById('next')?.addEventListener('click',()=>go(idx+1));if(idx>0){const im=document.getElementById('screen');const run=()=>alignMarker(im,s);im.addEventListener('load',run,{once:true});if(im.complete)run()}window.scrollTo({top:0,behavior:'smooth'})}
function alignMarker(img,s){const m=document.getElementById('marker'),l=document.getElementById('markerLabel'),n=document.getElementById('detectNote');if(!m||!l||!s.marker)return;place(m,l,s.marker,s.label);if(n)n.textContent='Marker position is mapped specifically for this screenshot — no automatic guessing.'}
function place(m,l,b,text){const x=Math.max(.3,b.x),y=Math.max(.3,b.y),w=Math.max(5,Math.min(30,b.w)),h=Math.max(3,Math.min(10,b.h));m.style.left=x+'%';m.style.top=y+'%';m.style.width=w+'%';m.style.height=h+'%';m.hidden=false;let lx=Math.min(78,x+w+1.5);l.style.left=lx+'%';l.style.top=(y+Math.max(0,h/2-2.4))+'%';l.textContent=text;l.hidden=false}
function go(i){if(i<0||i>=steps.length)return;idx=i;render()}
document.addEventListener('keydown',ev=>{if(ev.target&&/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName))return;if(ev.key==='ArrowRight')go(idx+1);if(ev.key==='ArrowLeft')go(idx-1)});
render();
</script>
<!-- primcap-demo-v5-screen6-corrected -->
</body></html>
