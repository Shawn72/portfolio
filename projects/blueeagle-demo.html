<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blue Eagle SACCO — Interactive Client Walkthrough</title><style>:root{--navy:#0b1739;--blue:#2f6fed;--red:#ff3b30;--ink:#17213b;--muted:#68718a;--line:#dde3ef}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#eef2f8;color:var(--ink)}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#0b1739,#08122d);color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:22px;font-weight:850}.brand small{display:block;margin-top:4px;color:#9eb0db;font-size:10px;letter-spacing:.8px}.section-label{font-size:10px;text-transform:uppercase;color:#7586b4;letter-spacing:1px;margin:22px 10px 8px}.nav button{width:100%;border:0;background:transparent;color:#b8c3e0;text-align:left;padding:10px 11px;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer;margin:2px 0}.nav button.on{background:#ffffff14;color:#fff;box-shadow:inset 3px 0 #5e8df7}.num{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;border-radius:50%;background:#ffffff10;font-size:10px}.back{display:block;color:#9eb0db;text-decoration:none;font-size:12px;font-weight:700;margin:18px 10px}.main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}.top h1{font-size:19px;margin:0}.top p{font-size:11px;color:var(--muted);margin:3px 0 0}.progress{font-size:12px;font-weight:800;color:var(--muted)}.content{padding:24px;max-width:1500px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 8px 28px rgba(20,35,70,.06)}.head{padding:21px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:18px}.head h2{margin:4px 0 6px;font-size:24px}.head p{margin:0;color:var(--muted);font-size:13px;line-height:1.5;max-width:900px}.path{white-space:nowrap;background:#edf3ff;color:#234caa;padding:8px 11px;border-radius:999px;font-size:11px;font-weight:850;height:max-content}.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px}.visual{background:#101829;padding:20px;display:grid;place-items:center;min-height:570px}.shot{position:relative;width:100%;max-width:1080px;overflow:hidden;border-radius:12px;background:#fff;box-shadow:0 18px 55px rgba(0,0,0,.28)}.shot img{display:block;width:100%;height:auto}.marker{position:absolute;border:4px solid var(--red);border-radius:9px;box-shadow:0 0 0 5px rgba(255,59,48,.15);pointer-events:none;animation:pulse 1.6s infinite}.marker:after{content:"";position:absolute;right:-10px;top:50%;transform:translateY(-50%);width:13px;height:13px;border-radius:50%;background:var(--red);border:3px solid #fff}.label{position:absolute;background:var(--red);color:#fff;padding:7px 10px;border-radius:8px;font-size:11px;font-weight:850;max-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.22)}.label:before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:8px solid var(--red)}@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(255,59,48,.12)}50%{box-shadow:0 0 0 10px rgba(255,59,48,.025)}}.notes{padding:23px;background:#fbfcff;border-left:1px solid var(--line)}.notes h3{font-size:14px;margin:0 0 11px}.notes ol{margin:0;padding-left:20px}.notes li{font-size:12px;line-height:1.55;margin-bottom:10px}.tip,.outcome{margin-top:14px;padding:12px;border-radius:10px;font-size:12px;line-height:1.5}.tip{background:#f2f7ff;border:1px solid #dce8ff;color:#365079}.outcome{background:#f2fbf7;border:1px solid #d7f1e5;color:#27694e}.legend{padding:10px 22px;background:#fff8f7;color:#8e2a23;font-size:11px;border-top:1px solid #ffe1de}.controls{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 20px;border-top:1px solid var(--line)}.btn{border:1px solid var(--line);background:#fff;padding:10px 15px;border-radius:9px;font-weight:850;cursor:pointer}.btn.next{background:var(--blue);color:#fff;border-color:var(--blue)}.btn:disabled{opacity:.35}.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.dot{width:8px;height:8px;border-radius:50%;background:#d5dbea}.dot.on{background:var(--blue);transform:scale(1.25)}.cover{padding:44px;background:linear-gradient(135deg,#0b1739,#17336f 60%,#2f6fed);color:#fff;min-height:600px;display:grid;grid-template-columns:1.25fr .75fr;gap:34px;align-items:center}.badge{display:inline-block;padding:8px 11px;border-radius:999px;background:#ffffff15;border:1px solid #ffffff20;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.8px}.cover h2{font-size:44px;line-height:1.05;max-width:760px;margin:12px 0 16px}.cover p{max-width:820px;color:#dbe5ff;line-height:1.6}.flow{background:#ffffff0e;border:1px solid #ffffff1e;border-radius:16px;padding:20px}.flow div{padding:11px 0;border-bottom:1px solid #ffffff16;font-size:12px}.flow div:last-child{border:0}@media(max-width:1050px){.app{grid-template-columns:1fr}.side{display:none}.stage{grid-template-columns:1fr}.notes{border-left:0;border-top:1px solid var(--line)}.cover{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">BLUE EAGLE SACCO<small>INTERACTIVE PORTAL WALKTHROUGH</small></div><div class="section-label">Guided journey</div><div class="nav" id="nav"></div><a class="back" href="blueeagle.html">← Back to Blue Eagle project</a></aside><main class="main"><div class="top"><div><h1>Blue Eagle SACCO</h1><p>Admin & member portal — interactive client presentation</p></div><div class="progress" id="progress"></div></div><div class="content"><div class="card" id="card"></div></div></main></div><script>const BASE='../assets/blueeagle/';const steps=[{menu:'Overview',title:'Welcome: Blue Eagle SACCO platform',image:null,intro:'A guided tour of the connected staff administration and member self-service portals, backed by a shared .NET API and live Dynamics NAV / Business Central data.',notes:['Present the admin portal first, then show what the member sees.','Use the real production screenshots throughout the walkthrough.'],outcome:'The client sees one connected SACCO platform serving staff operations and member self-service.'},{menu:'Admin → Portal Users',title:'1. Manage member portal accounts',image:'admin-portal-users.png',intro:'Staff can manage member portal access from one operational view.',notes:['Open Portal Users.','Review active and disabled member accounts.','Activate, disable, or remove access according to staff rights.'],outcome:'Member portal access remains centrally controlled.',label:'Portal Users',marker:{x:.8,y:19.0,w:10.2,h:3.9}},{menu:'Tickets → All Tickets',title:'2. Resolve member support requests',image:'admin-tickets.png',intro:'The built-in ticketing area keeps member support issues visible and traceable.',notes:['Open Tickets → All Tickets.','Review priority, status and assignment.','Resolve the request while retaining its activity history.'],outcome:'Support stays inside the operational portal rather than being scattered across channels.',label:'All Tickets',marker:{x:.8,y:30.3,w:10.2,h:3.9}},{menu:'Administration → Roles & Rights',title:'3. Control administrator permissions',image:'admin-roles-rights.png',intro:'Named rights define exactly what each administrative role can perform.',notes:['Open Administration → Roles & Rights.','Select the role.','Review and assign only the required named rights.'],outcome:'Administrative access is explicit, explainable and auditable.',label:'Roles & Rights',marker:{x:.8,y:53.4,w:10.2,h:3.9}},{menu:'Administration → Manage Admins',title:'4. Manage portal administrators',image:'admin-manage-admins.png',intro:'Authorized staff can create administrators, assign roles and manage credentials.',notes:['Open Administration → Manage Admins.','Add or review the administrator.','Assign the correct role and manage account credentials.'],outcome:'Staff administration is handled from the portal with role-based control.',label:'Manage Admins',marker:{x:.8,y:41.7,w:10.2,h:3.9}},{menu:'Administration → Member Portal Management',title:'5. Decide what members can see',image:'admin-member-portal-management.png',intro:'Member Portal Management controls sidebar visibility down to selected member accounts.',notes:['Open Member Portal Management.','Choose a member-portal section.','Set visibility for all active members or selected accounts.'],outcome:'The member experience can be tailored without changing frontend code.',label:'Member Portal Management',marker:{x:.8,y:57.4,w:10.2,h:3.9}},{menu:'System → Logs',title:'6. Maintain application logs',image:'admin-logs.png',intro:'Authorized administrators can preview, download and clean up operational logs.',notes:['Open System → Logs.','Review the relevant log category and file.','Preview or download before cleanup when investigation is required.'],outcome:'Operational maintenance is available without direct server access.',label:'Logs',marker:{x:.8,y:68.8,w:10.2,h:3.9}},{menu:'System → Restore Backup',title:'7. Restore a deployment backup',image:'admin-restore-backup.png',intro:'The rollback tool allows controlled restoration of Production or UAT deployment packages.',notes:['Open System → Restore Backup.','Select the IIS site/subsite.','Choose the required dated deployment backup before restoring.'],outcome:'Recovery can be performed through controlled application tooling.',label:'Restore Backup',marker:{x:.8,y:64.7,w:10.2,h:3.9}},{menu:'Member Portal → Dashboard',title:'8. Member account position',image:'member-dashboard.png',intro:'Members see their financial position at a glance from live SACCO ledger data.',notes:['Open Dashboard.','Review shares, savings and loan balance.','Show loan limits with and without guarantors.'],outcome:'Members get an immediate self-service view of their account position.',label:'Dashboard',marker:{x:.8,y:19.0,w:10.2,h:3.9}},{menu:'Member Portal → Statements',title:'9. Consolidated member statement',image:'member-statements.png',intro:'The Statements area provides a consolidated view of funds and loans with PDF export.',notes:['Open Statements.','Review the consolidated account activity.','Export the statement to PDF when required.'],outcome:'Members can retrieve their own financial history without staff intervention.',label:'Statements',marker:{x:.8,y:23.1,w:10.2,h:3.9}}];let idx=0;const nav=document.getElementById('nav'),card=document.getElementById('card'),progress=document.getElementById('progress');const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');function renderNav(){nav.innerHTML=steps.map((s,i)=>`<button class="${i===idx?'on':''}" data-i="${i}"><span class="num">${i}</span>${esc(s.menu)}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i))}function cover(s){return `<div class="cover"><div><span class="badge">Interactive Client Prototype</span><h2>Blue Eagle SACCO — Admin & Member Portals</h2><p>${esc(s.intro)}</p><p style="font-size:12px;color:#b9c9ef">Markers are mapped from the actual 1870×1020 screenshots and the real 216px application sidebars.</p></div><div class="flow"><div>01 — Portal users</div><div>02 — Support tickets</div><div>03 — Roles & rights</div><div>04 — Manage admins</div><div>05 — Member portal visibility</div><div>06 — Logs</div><div>07 — Restore backup</div><div>08 — Member dashboard</div><div>09 — Statements</div></div></div>`}function regular(s){return `<div class="head"><div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--blue);font-weight:850">Blue Eagle walkthrough</div><h2>${esc(s.title)}</h2><p>${esc(s.intro)}</p></div><div class="path">Menu: ${esc(s.menu)}</div></div><div class="stage"><div class="visual"><div class="shot"><img src="${BASE+s.image}" alt="${esc(s.title)}"><div class="marker" style="left:${s.marker.x}%;top:${s.marker.y}%;width:${s.marker.w}%;height:${s.marker.h}%"></div><div class="label" style="left:${Math.min(s.marker.x+s.marker.w+2,72)}%;top:${s.marker.y}%">${esc(s.label)}</div></div></div><aside class="notes"><h3>What to explain</h3><ol>${s.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ol><div class="tip"><strong>Presenter tip:</strong> Start with the red-highlighted menu/action, then explain the business value of the page.</div><div class="outcome"><strong>Outcome:</strong> ${esc(s.outcome)}</div></aside></div><div class="legend">Red highlight = the actual navigation row for this screenshot. Admin and member portal layouts are mapped separately.</div>`}function controls(){return `<div class="controls"><button class="btn" id="prev" ${idx===0?'disabled':''}>← Previous</button><div class="dots">${steps.map((_,i)=>`<span class="dot ${i===idx?'on':''}"></span>`).join('')}</div><button class="btn next" id="next" ${idx===steps.length-1?'disabled':''}>Next →</button></div>`}function render(){let s=steps[idx];card.innerHTML=(idx===0?cover(s):regular(s))+controls();progress.textContent=`Step ${idx+1} of ${steps.length}`;renderNav();document.getElementById('prev').onclick=()=>go(idx-1);document.getElementById('next').onclick=()=>go(idx+1);window.scrollTo({top:0,behavior:'smooth'})}function go(i){if(i<0||i>=steps.length)return;idx=i;render()}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1)});render();</script><!-- blueeagle-demo-v2-real-sidebar-geometry --></body></html>
