<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ninjax Inventory & POS — Client Walkthrough Prototype</title>
<style>
:root{
  --navy:#0b1739; --navy2:#122354; --blue:#2f6fed; --ink:#17213b;
  --muted:#68718a; --line:#dde3ef; --soft:#f6f8fc; --white:#fff;
  --accent:#ff3b30; --green:#1f9d69; --gold:#f4b942;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#eef2f8;color:var(--ink)}
.app{min-height:100vh;display:grid;grid-template-columns:280px 1fr}
.sidebar{background:linear-gradient(180deg,var(--navy),#09132e);color:#fff;padding:26px 20px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:800;font-size:22px;letter-spacing:.2px;margin-bottom:4px}
.brand small{display:block;color:#9eb0db;font-size:11px;font-weight:600;margin-top:4px;letter-spacing:.5px}
.section-label{font-size:10px;text-transform:uppercase;color:#7788b8;letter-spacing:1px;margin:24px 10px 8px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#b8c3e0;padding:10px 12px;border-radius:10px;text-align:left;cursor:pointer;font-weight:650;font-size:13px;margin:2px 0}
.navbtn:hover,.navbtn.active{background:#ffffff12;color:#fff}
.navbtn.active{box-shadow:inset 3px 0 0 #5e8df7}
.navbtn span.num{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:#ffffff10;font-size:10px}
.main{min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.titleblock h1{font-size:19px;margin:0}.titleblock p{font-size:12px;color:var(--muted);margin:3px 0 0}
.progress{font-size:12px;color:var(--muted);font-weight:700}
.content{padding:26px;max-width:1500px;margin:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 30px rgba(20,35,70,.06);overflow:hidden}
.stephead{display:grid;grid-template-columns:1fr auto;gap:18px;padding:22px 24px;border-bottom:1px solid var(--line);align-items:start}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--blue);font-weight:800}
.stephead h2{font-size:25px;margin:5px 0 6px}
.stephead p{margin:0;color:var(--muted);font-size:14px;max-width:900px;line-height:1.55}
.menupath{white-space:nowrap;background:#edf3ff;color:#234caa;border:1px solid #cfdcff;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0}
.visual{background:#101829;padding:22px;min-height:580px;display:grid;place-items:center}
.screenwrap{position:relative;width:100%;max-width:1050px;border-radius:14px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.35);background:#fff}
.screenwrap img{display:block;width:100%;height:auto;min-height:380px;object-fit:contain;background:#fff}
.ring{position:absolute;border:4px solid var(--accent);border-radius:10px;box-shadow:0 0 0 5px rgba(255,59,48,.15);pointer-events:none;animation:pulse 1.6s infinite}
.ring::after{content:"";position:absolute;right:-10px;top:50%;transform:translateY(-50%);width:14px;height:14px;background:var(--accent);border-radius:50%;border:3px solid white}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(255,59,48,.12)}50%{box-shadow:0 0 0 11px rgba(255,59,48,.02)}}
.callout{position:absolute;background:var(--accent);color:#fff;padding:7px 10px;border-radius:8px;font-size:11px;font-weight:800;box-shadow:0 8px 25px rgba(0,0,0,.25)}
.callout::before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:8px solid var(--accent)}
.notes{padding:26px;background:#fbfcff;border-left:1px solid var(--line)}
.notes h3{margin:0 0 12px;font-size:15px}
.notes ol{padding-left:20px;margin:0}
.notes li{margin:0 0 12px;color:#39425a;font-size:13px;line-height:1.5}
.tip{margin-top:20px;padding:14px;border-radius:12px;background:#f2f7ff;border:1px solid #dce8ff;font-size:12px;line-height:1.5;color:#365079}
.outcome{margin-top:12px;padding:14px;border-radius:12px;background:#f2fbf7;border:1px solid #d7f1e5;font-size:12px;color:#27694e;line-height:1.5}
.controls{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-top:1px solid var(--line);background:#fff}
.btn{border:1px solid var(--line);background:#fff;padding:11px 16px;border-radius:10px;font-weight:800;color:#31405e;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.dots{display:flex;gap:6px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#d5dbea}.dot.on{background:var(--blue);transform:scale(1.3)}
.legend{padding:12px 24px;background:#fff8f7;border-top:1px solid #ffe1de;color:#8e2a23;font-size:11px}
.cover{padding:44px;background:linear-gradient(135deg,#0b1739 0%,#17336f 55%,#2f6fed 100%);color:#fff;min-height:620px;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:40px}
.cover h2{font-size:46px;line-height:1.05;margin:10px 0 16px;max-width:740px}.cover p{font-size:17px;line-height:1.6;color:#dbe5ff;max-width:760px}
.cover .badge{display:inline-block;padding:8px 12px;border-radius:999px;background:#ffffff15;border:1px solid #ffffff22;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}
.flow{background:#ffffff10;border:1px solid #ffffff1f;border-radius:18px;padding:22px}
.flow div{padding:12px 0;border-bottom:1px solid #ffffff16;font-size:13px}.flow div:last-child{border-bottom:0}
.mobile-note{display:none}
@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{display:none}.stage{grid-template-columns:1fr}.notes{border-left:0;border-top:1px solid var(--line)}.cover{grid-template-columns:1fr}.mobile-note{display:block}}
@media print{.sidebar,.topbar,.controls{display:none}.app{display:block}.content{padding:0}.card{box-shadow:none;border:0}.stage{grid-template-columns:1fr}.notes{page-break-before:avoid}.cover{min-height:auto}.step{page-break-after:always}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">NINJAX <small>CLIENT DEMO WALKTHROUGH</small></div>
    <div class="section-label">End-to-end journey</div>
    <div id="nav"></div>
    <a href="ninjax.html" style="display:inline-block;margin:18px 10px 0;color:#9eb0db;text-decoration:none;font-size:12px;font-weight:700">← Back to Ninjax project</a>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="titleblock">
        <h1>Ninjax Inventory & POS</h1>
        <p>Interactive client presentation prototype</p>
      </div>
      <div class="progress" id="progress"></div>
    </div>
    <div class="content">
      <div class="card" id="card"></div>
    </div>
  </main>
</div>

<script>
const base="../assets/ninjax/";
const steps=[
{title:"Welcome: how Ninjax works",menu:"Overview",image:null,intro:"A complete operating journey from licensing a client to stocking products, selling at the till, tracking finances, and renewing the subscription.",notes:["Ninjax uses three connected surfaces: Subscription Admin, Client Portal, and Inventory/POS Admin.","The Ninjax team provisions the business first; the client then manages subscription status and activation; staff use the Inventory/POS app day to day.","Use the left-hand presentation menu or the Previous/Next buttons to move through the demo."],outcome:"By the end of this walkthrough, the client understands the complete business flow rather than seeing isolated screens."},
{title:"1. Provision the business",menu:"Subscription Admin → Clients",image:"subadmin-clients.png",intro:"Ninjax starts by creating and licensing the client business in the internal subscription console.",notes:["Open the Clients menu in the Ninjax Subscription Admin console.","Create or select the client business and assign the correct pricing plan.","Confirm subscription status, renewal date, and activation key state.","Use client actions for support, suspension, reset, or communication when required."],outcome:"The business is now licensed and ready to activate its operational inventory environment.",ring:{l:2.4,t:24,w:15.5,h:6.5},callout:{l:19.5,t:24,text:"Clients"}},
{title:"2. Configure the subscription plan",menu:"Subscription Admin → Plans",image:"subadmin-plans.png",intro:"Plans control what the client pays and the billing cycle applied to the business.",notes:["Open Plans.","Select the appropriate plan — for example Owner Account, Basic Ninja, or Pro Ninja.","Review the plan price and billing-cycle duration.","Save any approved pricing or cycle changes before assigning them to clients."],outcome:"The commercial terms are set centrally without changing the POS application code.",ring:{l:2.4,t:31.5,w:15.5,h:6.5},callout:{l:19.5,t:31.5,text:"Plans"}},
{title:"3. Client activation & renewal",menu:"Client Portal → Dashboard",image:"client-portal-dashboard.png",intro:"The business owner uses the Client Portal to see the current subscription, renewal status, payment references, and activation key.",notes:["Sign in to the client portal.","Confirm the current plan and days remaining.","Renew using the available payment path such as M-Pesa or bank transfer.","Track the payment reference and payment history.","Use the activation key to unlock the subscribed Inventory/POS environment."],outcome:"A valid subscription enables the operational POS modules; when subscription access lapses, protected POS modules can be locked.",ring:{l:2.4,t:29,w:15.5,h:6.5},callout:{l:19.5,t:29,text:"Dashboard"}},
{title:"4. Start on the operations dashboard",menu:"Inventory/POS → Dashboard",image:"admin-dashboard.png",intro:"The dashboard is the staff landing page for stock status and daily operational awareness.",notes:["Sign in to the Inventory/POS Admin application.","Review item totals, categories, low-stock warnings, and recent stock activity.","Use the dashboard to identify what needs attention before opening the till."],outcome:"Management gets an immediate snapshot of inventory health.",ring:{l:0.8,t:29.5,w:14.5,h:6.3},callout:{l:17.2,t:29.5,text:"Dashboard"}},
{title:"5. Create and maintain items",menu:"Inventory → Items",image:"admin-items.png",intro:"Products are created here with the information needed for stock control and selling.",notes:["Expand the Inventory group in the left menu.","Open Items.","Add or edit the product name, SKU/barcode, category, selling price, cost, quantity, and any required stock details.","Verify the live quantity and pricing before making the product available to the till."],outcome:"The product is now part of controlled inventory and can be sold through POS.",ring:{l:0.8,t:39.2,w:14.5,h:5.8},callout:{l:17.2,t:39.2,text:"Inventory → Items"}},
{title:"6. Add product photos & features",menu:"Inventory → Photos & Features",image:"admin-photos-features.png",intro:"Product media and structured features make the catalog richer and support ecommerce/storefront presentation.",notes:["Open Photos & Features under Inventory.","Select the item.","Upload or choose the main image and additional gallery views.","Add structured product features/specifications where required."],outcome:"The item now has customer-facing visuals and structured product information.",ring:{l:0.8,t:44.3,w:14.5,h:5.8},callout:{l:17.2,t:44.3,text:"Photos & Features"}},
{title:"7. Configure store locations",menu:"Sales & Till → Stores",image:"admin-stores.png",intro:"Every sale, stock movement, and finance view can be associated with a store location.",notes:["Expand Sales & Till.","Open Stores.","Create or verify the physical outlet/location.","Make sure the intended location is available to the till and reporting views."],outcome:"Transactions can now be reported by outlet and consolidated across the business.",ring:{l:0.8,t:69,w:14.5,h:5.8},callout:{l:17.2,t:69,text:"Stores"}},
{title:"8. Configure staff access",menu:"Administration → Roles & Rights",image:"admin-roles-rights.png",intro:"Role permissions determine exactly what different staff members can view or manage.",notes:["Expand Administration.","Open Roles & Rights.","Review roles such as Administrator, Senior Staff, and Staff.","Assign the required permission rights such as pos.sell, items.manage, accounting.view, or users.manage.","Keep sensitive accounting and administration rights limited to authorized roles."],outcome:"The business controls operational risk by giving each user only the rights they need.",ring:{l:0.8,t:87,w:14.5,h:5.8},callout:{l:17.2,t:87,text:"Roles & Rights"}},
{title:"9. Create staff users",menu:"Administration → Users",image:"admin-users.png",intro:"After roles are ready, staff accounts can be registered and assigned to the correct permission profile.",notes:["Open Users.","Register the staff member.","Assign the appropriate role.","Verify account status and last-login information.","Deactivate accounts when staff should no longer have system access."],outcome:"Authorized employees can now operate the system using role-based access.",ring:{l:0.8,t:82,w:14.5,h:5.8},callout:{l:17.2,t:82,text:"Users"}},
{title:"10. Sell at the till",menu:"Sales & Till → Till",image:"admin-till.png",intro:"The till is the main point-of-sale workflow: identify the product, build the cart, and take payment.",notes:["Open Till under Sales & Till.","Scan the barcode/SKU with camera support or enter it manually.","Confirm the item, quantity, price, taxes, and cart total.","Choose the payment path: Cash, Card, M-Pesa, or On Account/Credit.","Complete the sale and issue the transaction record/receipt as required."],outcome:"The sale is recorded against the relevant store and becomes available to sales and financial reporting.",ring:{l:0.8,t:58,w:14.5,h:5.8},callout:{l:17.2,t:58,text:"Till"}},
{title:"11. Review sales activity",menu:"Sales & Till → Sales",image:"admin-sales.png",intro:"Managers can review transaction history and filter the data for operational reconciliation.",notes:["Open Sales.","Filter by location/store, date range, or status.","Open a transaction when more detail is needed.","Export to Excel or PDF for reconciliation, sharing, or record keeping."],outcome:"Management has a searchable audit view of POS sales activity.",ring:{l:0.8,t:63.5,w:14.5,h:5.8},callout:{l:17.2,t:63.5,text:"Sales"}},
{title:"12. Record business expenses",menu:"Finance → Expenses",image:"admin-expenses.png",intro:"Operating expenses are recorded with accounting categories so they feed directly into financial reporting.",notes:["Expand Finance.","Open Expenses.","Record the amount, accounting category/code, payment method, date, and store/location.","Save the expense and verify it appears in the expense history."],outcome:"Expenses become part of the same finance picture as POS sales revenue.",ring:{l:0.8,t:76.5,w:14.5,h:5.8},callout:{l:17.2,t:76.5,text:"Expenses"}},
{title:"13. Review Profit & Loss",menu:"Finance → Profit & Loss",image:"admin-profit-loss.png",intro:"The Profit & Loss view combines sales revenue and recorded expenses for the selected period.",notes:["Open Profit & Loss.","Choose the required reporting period and store/location when applicable.","Review revenue, categorized expenses, and net income.","Export the result when it needs to be shared with management or finance teams."],outcome:"The client can see business performance directly from real till and expense activity.",ring:{l:0.8,t:71.5,w:14.5,h:5.8},callout:{l:17.2,t:71.5,text:"Profit & Loss"}},
{title:"14. Support and ongoing subscription",menu:"Subscription Admin → Support",image:"subadmin-support.png",intro:"Ninjax supports the client through the internal console while the business continues to renew through the client portal.",notes:["Open the client's support thread when assistance is required.","Track the conversation and open/closed status.","For renewal, the client returns to the Client Portal and completes payment before expiry.","If a subscription becomes inactive, subscribed POS functionality can be restricted until renewal is confirmed."],outcome:"The operating cycle is complete: provision → activate → configure → stock → sell → report → support → renew.",ring:{l:2.4,t:47,w:15.5,h:6.5},callout:{l:19.5,t:47,text:"Support"}}
];
let idx=0;
const nav=document.getElementById("nav"),card=document.getElementById("card"),progress=document.getElementById("progress");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function renderNav(){nav.innerHTML=steps.map((s,i)=>`<button class="navbtn ${i===idx?'active':''}" onclick="go(${i})"><span class="num">${i}</span><span>${esc(s.menu)}</span></button>`).join("")}
function cover(){const s=steps[0];return `<div class="cover"><div><span class="badge">Interactive Client Prototype</span><h2>Ninjax Inventory & POS — End-to-End Business Journey</h2><p>${esc(s.intro)}</p><p style="font-size:13px;color:#b9c9ef">Use this as a guided presentation. The red highlights on later screens indicate the exact menu area or action being discussed.</p></div><div class="flow"><div>01 — Provision client & plan</div><div>02 — Activate / renew subscription</div><div>03 — Configure inventory, stores & staff</div><div>04 — Sell through the till</div><div>05 — Review sales & expenses</div><div>06 — Read Profit & Loss</div><div>07 — Support & renew</div></div></div>`}
function regular(s){let ring="",call="";if(s.ring)ring=`<div class="ring" style="left:${s.ring.l}%;top:${s.ring.t}%;width:${s.ring.w}%;height:${s.ring.h}%"></div>`;if(s.callout)call=`<div class="callout" style="left:${s.callout.l}%;top:${s.callout.t}%">${esc(s.callout.text)}</div>`;return `<div class="stephead"><div><div class="kicker">Client walkthrough</div><h2>${esc(s.title)}</h2><p>${esc(s.intro)}</p></div><div class="menupath">Menu: ${esc(s.menu)}</div></div><div class="stage"><div class="visual"><div class="screenwrap"><img src="${base+s.image}" alt="${esc(s.title)}">${ring}${call}</div></div><aside class="notes"><h3>What to explain to the client</h3><ol>${s.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ol><div class="tip"><strong>Presenter tip:</strong> Point to the highlighted menu area first, then explain what the user does on the page and why it matters operationally.</div><div class="outcome"><strong>Outcome:</strong> ${esc(s.outcome)}</div></aside></div><div class="legend">Red highlight = the actual menu/action area to point out during the demo. Exact visibility can depend on user permissions and subscription state.</div>`}
function controls(){return `<div class="controls"><button class="btn" onclick="go(${idx-1})" ${idx===0?'disabled':''}>← Previous</button><div class="dots">${steps.map((_,i)=>`<span class="dot ${i===idx?'on':''}"></span>`).join("")}</div><button class="btn primary" onclick="go(${idx+1})" ${idx===steps.length-1?'disabled':''}>Next →</button></div>`}
function render(){const s=steps[idx];card.innerHTML=(idx===0?cover():regular(s))+controls();progress.textContent=`Step ${idx+1} of ${steps.length}`;renderNav();window.scrollTo({top:0,behavior:"smooth"})}
function go(i){if(i<0||i>=steps.length)return;idx=i;render()}
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(idx+1);if(e.key==="ArrowLeft")go(idx-1)});
render();
</script>
<!-- interactive-demo-v3-marker-alignment -->
</body>
</html>
