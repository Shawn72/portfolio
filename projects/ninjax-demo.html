<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ninjax Inventory & POS — Interactive Client Walkthrough</title><style>
:root{--n:#0b1739;--b:#2f6fed;--r:#ff3b30;--t:#17213b;--m:#68718a;--l:#dde3ef}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#eef2f8;color:var(--t)}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:var(--n);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:21px;font-weight:800}.brand small{display:block;font-size:10px;color:#9eb0db;margin-top:4px}.nav{margin-top:20px}.nav button{width:100%;border:0;background:transparent;color:#b8c3e0;padding:9px 10px;border-radius:9px;text-align:left;font-weight:650;font-size:12px;cursor:pointer;margin:2px 0}.nav button.on{background:#ffffff14;color:#fff;box-shadow:inset 3px 0 #5e8df7}.back{display:block;color:#9eb0db;text-decoration:none;font-size:12px;font-weight:700;margin:18px 10px}.main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--l);padding:16px 24px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}.top h1{font-size:18px;margin:0}.top p{font-size:11px;color:var(--m);margin:3px 0 0}.prog{font-size:12px;font-weight:700;color:var(--m)}.content{padding:24px;max-width:1500px;margin:auto}.card{background:#fff;border:1px solid var(--l);border-radius:16px;overflow:hidden}.head{padding:20px 22px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:18px}.head h2{margin:4px 0 6px;font-size:23px}.head p{margin:0;color:var(--m);font-size:13px;line-height:1.5}.path{white-space:nowrap;background:#edf3ff;color:#234caa;padding:8px 11px;border-radius:999px;font-size:11px;font-weight:800;height:max-content}.stage{display:grid;grid-template-columns:minmax(0,1fr) 330px}.visual{background:#101829;padding:20px;display:grid;place-items:center;min-height:540px}.shot{position:relative;width:100%;max-width:1050px;overflow:hidden;border-radius:12px;background:#fff}.shot img{display:block;width:100%;height:auto}.mark{position:absolute;border:4px solid var(--r);border-radius:9px;box-shadow:0 0 0 5px #ff3b3025;pointer-events:none}.mark:after{content:"";position:absolute;right:-10px;top:50%;transform:translateY(-50%);width:13px;height:13px;background:var(--r);border:3px solid #fff;border-radius:50%}.label{position:absolute;background:var(--r);color:#fff;padding:7px 9px;border-radius:8px;font-size:11px;font-weight:800}.label:before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:8px solid var(--r)}.notes{padding:22px;background:#fbfcff;border-left:1px solid var(--l)}.notes h3{font-size:14px;margin:0 0 10px}.notes ol{margin:0;padding-left:19px}.notes li{font-size:12px;line-height:1.5;margin-bottom:10px}.out{margin-top:14px;padding:12px;background:#f2fbf7;border:1px solid #d7f1e5;border-radius:10px;font-size:12px;color:#27694e;line-height:1.5}.legend{padding:10px 22px;background:#fff8f7;color:#8e2a23;font-size:11px;border-top:1px solid #ffe1de}.controls{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-top:1px solid var(--l)}.btn{border:1px solid var(--l);background:#fff;padding:10px 15px;border-radius:9px;font-weight:800;cursor:pointer}.btn.next{background:var(--b);color:#fff;border-color:var(--b)}.btn:disabled{opacity:.35}.cover{padding:42px;background:linear-gradient(135deg,#0b1739,#17336f 60%,#2f6fed);color:#fff;min-height:580px}.cover h2{font-size:42px;max-width:800px;margin:12px 0}.cover p{max-width:850px;color:#dbe5ff;line-height:1.6}.flow{margin-top:28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:850px}.flow div{background:#ffffff12;border:1px solid #ffffff20;padding:12px;border-radius:10px;font-size:12px}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{display:none}.stage{grid-template-columns:1fr}.notes{border-left:0;border-top:1px solid var(--l)}}
</style></head><body><div class="app"><aside class="side"><div class="brand">NINJAX<small>INTERACTIVE CLIENT WALKTHROUGH</small></div><div class="nav" id="nav"></div><a class="back" href="ninjax.html">← Back to Ninjax project</a></aside><main class="main"><div class="top"><div><h1>Ninjax Inventory & POS</h1><p>Interactive client presentation prototype</p></div><div class="prog" id="prog"></div></div><div class="content"><div class="card" id="card"></div></div></main></div><script>
const B='../assets/ninjax/';
const S=[
['Overview','Welcome: how Ninjax works',null,'A complete journey from licensing a client to stock, sales, finance, support and renewal.',['Ninjax has three connected surfaces: Subscription Admin, Client Portal and Inventory/POS Admin.','Use Previous/Next or the left menu to present the process end to end.'],'The client sees one complete operating lifecycle rather than isolated screens.'],
['Subscription Admin → Clients','1. Provision the business','subadmin-clients.png','Create and license the client business in Ninjax Subscription Admin.',['Open Clients.','Create or select the business and assign the correct plan.','Confirm subscription, renewal date and activation-key state.'],'The business is licensed and ready for activation.'],
['Subscription Admin → Plans','2. Configure the subscription plan','subadmin-plans.png','Plans control pricing and billing cycle.',['Open Plans.','Choose the correct plan.','Review price and billing-cycle duration before assignment.'],'Commercial terms are controlled centrally.'],
['Client Portal → Dashboard','3. Client activation & renewal','client-portal-dashboard.png','The business owner manages subscription status and activation here.',['Confirm the current plan and days remaining.','Renew by the available payment method.','Track payment history/reference and use the activation key.'],'A valid subscription enables protected POS features.'],
['Inventory/POS → Dashboard','4. Start on the operations dashboard','admin-dashboard.png','The staff landing page gives a quick stock and operations overview.',['Review totals, categories and low-stock alerts.','Check recently updated stock before operating the till.'],'Management gets an immediate inventory-health snapshot.'],
['Inventory → Items','5. Create and maintain items','admin-items.png','Create products with the data needed for stock control and selling.',['Open Items.','Add or edit SKU/barcode, category, price, cost and quantity.','Verify pricing and stock before sale.'],'The product becomes controlled inventory available to POS.'],
['Inventory → Photos & Features','6. Add product photos & features','admin-photos-features.png','Add customer-facing product media and structured specifications.',['Open Photos & Features.','Select the item and upload the main/gallery images.','Add structured features where required.'],'The item is ready for richer catalog/storefront presentation.'],
['Sales & Till → Stores','7. Configure store locations','admin-stores.png','Locations allow sales and finance to be tracked by outlet.',['Open Stores.','Create or verify the outlet.','Confirm it is available to till and reporting.'],'Transactions can be reported per store or consolidated.'],
['Administration → Roles & Rights','8. Configure staff access','admin-roles-rights.png','Roles determine exactly what staff can view or manage.',['Open Roles & Rights.','Assign only the permissions each role needs.','Keep accounting/admin rights restricted.'],'The business controls operational access and risk.'],
['Administration → Users','9. Create staff users','admin-users.png','Register staff and assign the correct role.',['Open Users.','Register the staff member and assign a role.','Deactivate access when no longer required.'],'Authorized employees can use the system with role-based access.'],
['Sales & Till → Till','10. Sell at the till','admin-till.png','Scan/search products, build the cart and take payment.',['Open Till.','Scan a barcode/SKU or enter it manually.','Confirm quantity, price, tax and total.','Choose Cash, Card, M-Pesa or On Account/Credit and complete the sale.'],'The sale is recorded against the relevant store and feeds reporting.'],
['Sales & Till → Sales','11. Review sales activity','admin-sales.png','Review and reconcile POS transaction history.',['Open Sales.','Filter by store, status or date range.','Export to Excel/PDF when required.'],'Management gets a searchable audit view of sales.'],
['Finance → Expenses','12. Record business expenses','admin-expenses.png','Categorized expenses feed directly into finance reporting.',['Open Expenses.','Capture amount, account/category, payment method, date and store.','Save and verify the record.'],'Expenses join POS revenue in the finance picture.'],
['Finance → Profit & Loss','13. Review Profit & Loss','admin-profit-loss.png','Review revenue, expenses and net income for a period.',['Open Profit & Loss.','Choose the period and store where applicable.','Review totals and export when required.'],'The client sees business performance from real operating activity.'],
['Subscription Admin → Support','14. Support and ongoing subscription','subadmin-support.png','Support closes the loop while the client continues renewing through the portal.',['Open the client support thread.','Track conversation and status.','For renewal, return to the Client Portal before expiry.'],'Lifecycle complete: provision → activate → configure → sell → report → support → renew.']
];
let i=0;const card=document.getElementById('card'),nav=document.getElementById('nav'),prog=document.getElementById('prog');
const e=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function navs(){nav.innerHTML=S.map((s,n)=>`<button type="button" class="${n===i?'on':''}" data-i="${n}">${n}. ${e(s[0])}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.i)))}
function cover(){return `<section class="cover"><small>INTERACTIVE CLIENT PROTOTYPE</small><h2>Ninjax Inventory & POS — End-to-End Business Journey</h2><p>${e(S[0][3])}</p><div class="flow"><div>01 — Provision client & plan</div><div>02 — Activate / renew</div><div>03 — Configure stock, stores & staff</div><div>04 — Sell through the till</div><div>05 — Review sales & expenses</div><div>06 — Read Profit & Loss</div><div>07 — Support & renew</div></div></section>`}
function page(s){const label=e(s[0].split('→').pop().trim());return `<section><div class="head"><div><small>CLIENT WALKTHROUGH</small><h2>${e(s[1])}</h2><p>${e(s[3])}</p></div><div class="path">Menu: ${e(s[0])}</div></div><div class="stage"><div class="visual"><div class="shot"><img src="${B+s[2]}" alt="${e(s[1])}"><div class="mark" hidden></div><div class="label" hidden>${label}</div></div></div><aside class="notes"><h3>What to explain to the client</h3><ol>${s[4].map(x=>`<li>${e(x)}</li>`).join('')}</ol><div class="out"><strong>Outcome:</strong> ${e(s[5])}</div></aside></div><div class="legend">Red highlight is positioned from the active navigation row detected in this screenshot — no hard-coded menu Y coordinate.</div></section>`}
function controls(){return `<div class="controls"><button type="button" class="btn prev" ${i===0?'disabled':''}>← Previous</button><span>${i+1} / ${S.length}</span><button type="button" class="btn next" ${i===S.length-1?'disabled':''}>Next →</button></div>`}
function marker(){if(i===0)return;const shot=card.querySelector('.shot'),img=shot.querySelector('img'),mark=shot.querySelector('.mark'),label=shot.querySelector('.label');const run=()=>{try{const W=img.naturalWidth,H=img.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);const d=x.getImageData(0,0,W,H).data,L=(a,b)=>{let q=(b*W+a)*4;return(d[q]+d[q+1]+d[q+2])/3},x0=W*.01|0,x1=W*.16|0,y0=H*.18|0,y1=H*.90|0,v=[];for(let y=y0;y<y1;y+=5)for(let a=x0;a<x1;a+=5)v.push(L(a,y));v.sort((a,b)=>a-b);const base=v[v.length>>1]||28,win=Math.max(10,H*.038|0);let best={s:-1,y:H*.3};for(let cy=y0+(win>>1);cy<y1-(win>>1);cy+=2){let hit=0,n=0;for(let y=cy-(win>>1);y<cy+(win>>1);y+=3)for(let a=x0;a<x1;a+=4){let z=L(a,y);if(z>base+10&&z<185)hit++;n++}let sc=hit/n;if(sc>best.s)best={s:sc,y:cy}}let top=(best.y-win/2)/H*100,left=.8,width=14.5,height=Math.max(3.5,Math.min(5.2,win/H*100));mark.style.cssText=`left:${left}%;top:${top}%;width:${width}%;height:${height}%`;label.style.cssText=`left:${left+width+2.2}%;top:${top}%`;mark.hidden=label.hidden=false}catch(err){mark.hidden=label.hidden=true}};img.complete?run():img.addEventListener('load',run,{once:true})}
function render(){const s=S[i];card.innerHTML=(i===0?cover():page(s))+controls();prog.textContent=`Step ${i+1} of ${S.length}`;navs();card.querySelector('.prev')?.addEventListener('click',()=>go(i-1));card.querySelector('.next')?.addEventListener('click',()=>go(i+1));marker();scrollTo({top:0,behavior:'smooth'})}function go(n){if(n<0||n>=S.length)return;i=n;render()}document.addEventListener('keydown',a=>{if(a.key==='ArrowRight')go(i+1);if(a.key==='ArrowLeft')go(i-1)});render();
</script><!-- interactive-demo-v4-auto-marker --></body></html>
